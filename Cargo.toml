[workspace]
members = [
    "bin/host",
    "crates/executor/client",
    "crates/executor/host",
    "crates/mpt",
    "crates/primitives",
    "crates/storage/rpc-db",
]
exclude = []
resolver = "2"

[profile.release-with-debug]
inherits = "release"
debug-assertions = true
debug = true

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["puma314", "jtguibas", "rkrasiuk"]
repository = "https://github.com/moongate-forks/minimal-reth"
homepage = "https://github.com/moongate-forks/minimal-reth"
exclude = ["**/target"]
version = "0.1.0"

[workspace.dependencies]
# pico
pico-sdk = { git = "https://github.com/brevis-network/pico.git", branch = "pico-subblock" }
pico-patch-libs = { git = "https://github.com/brevis-network/pico.git", branch = "pico-subblock" }
# pico-sdk = { path = "../brevis-vm/sdk/sdk" }
# pico-patch-libs = { path = "../brevis-vm/sdk/patch-libs" }

tracing = { version = "0.1.40", default-features = false }
cfg-if = "1.0.0"
spin = { version = "0.9.8", features = ["mutex"] }
async-trait = "0.1.80"
tokio = { version = "1.21", default-features = false, features = [
    "rt",
    "rt-multi-thread",
] }
serde_json = "1.0.94"
serde = { version = "1.0", default-features = false, features = ["derive"] }
futures = "0.3"
sha2 = "0.10.9"
# sha2 = { path = "../hashes/sha2" }
url = "2.3"
thiserror = "1.0.61"
hex-literal = "0.4.1"
rayon = "1.10.0"
rlp = "0.5.2"
bincode = "=1.3.3"
ruint = { git = "https://github.com/yuwen01/uint", branch = "yuwen/rkyv" }
rkyv = "0.8.10"
eyre = "0.6.12"
reqwest = "0.12.9"
base64 = "0.22.1"
hex = "0.4.3"
chrono = "0.4.39"
tracing-subscriber = "0.3.18"
dotenv = "0.15.0"
clap = { version = "4.5.7", features = ["derive", "env"] }
csv = "1.1"
lazy_static = "1.5.0"
itertools = "0.13.0"
serde_with = "3.12.0"
derive_more = "2.0"

# workspace
rsp-rpc-db = { path = "./crates/storage/rpc-db" }
rsp-client-executor = { path = "./crates/executor/client" }
rsp-host-executor = { path = "./crates/executor/host" }
rsp-mpt = { path = "./crates/mpt" }
rsp-primitives = { path = "./crates/primitives" }

# reth - pico branch
reth-primitives = { git = "https://github.com/brevis-network/reth.git", rev = "d899c7b", default-features = false, features = ["serde-bincode-compat", "std"] }
reth-primitives-traits = { git = "https://github.com/brevis-network/reth.git", rev = "d899c7b", default-features = false }
reth-codecs = { git = "https://github.com/brevis-network/reth.git", rev = "d899c7b", default-features = false }
reth-consensus = { git = "https://github.com/brevis-network/reth.git", rev = "d899c7b", default-features = false }
reth-evm = { git = "https://github.com/brevis-network/reth.git", rev = "d899c7b", default-features = false }
reth-revm = { git = "https://github.com/brevis-network/reth.git", rev = "d899c7b", default-features = false, features = [
    "std",
] }
reth-node-ethereum = { git = "https://github.com/brevis-network/reth.git", rev = "d899c7b", default-features = false }
reth-evm-ethereum = { git = "https://github.com/brevis-network/reth.git", rev = "d899c7b", default-features = false, features = [
    "std",
] }
reth-evm-optimism = { git = "https://github.com/brevis-network/reth.git", rev = "d899c7b", default-features = false, features = [
    "optimism",
] }
reth-storage-errors = { git = "https://github.com/brevis-network/reth.git", rev = "d899c7b", default-features = false, features = [
    "std",
] }
reth-trie = { git = "https://github.com/brevis-network/reth.git", rev = "d899c7b", default-features = false, features = ["serde"] }
reth-trie-common = { git = "https://github.com/brevis-network/reth.git", rev = "d899c7b", default-features = false }
reth-chainspec = { git = "https://github.com/brevis-network/reth.git", rev = "d899c7b", default-features = false }
reth-optimism-chainspec = { git = "https://github.com/brevis-network/reth.git", rev = "d899c7b", default-features = false }
reth-optimism-forks = { git = "https://github.com/brevis-network/reth.git", rev = "d899c7b", default-features = false }
reth-execution-errors = { git = "https://github.com/brevis-network/reth.git", rev = "d899c7b", default-features = false }
reth-execution-types = { git = "https://github.com/brevis-network/reth.git", rev = "d899c7b", default-features = false }
reth-db = { git = "https://github.com/brevis-network/reth.git", rev = "d899c7b", default-features = false }
reth-errors = { git = "https://github.com/brevis-network/reth.git", rev = "d899c7b", default-features = false }
reth-ethereum-consensus = { git = "https://github.com/brevis-network/reth.git", rev = "d899c7b", default-features = false }
reth-ethereum-primitives = { git = "https://github.com/brevis-network/reth.git", rev = "d899c7b", default-features = false, features = [
  "serde"
] }

