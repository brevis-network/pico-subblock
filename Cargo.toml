[workspace]
members = [
    "bin/host",
    "crates/executor/client",
    "crates/executor/host",
    "crates/mpt",
    "crates/primitives",
    "crates/storage/rpc-db",
]
exclude = []
resolver = "2"

[profile.release-with-debug]
inherits = "release"
debug-assertions = true
debug = true

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["puma314", "jtguibas", "rkrasiuk"]
repository = "https://github.com/brevis-network/pico-subblock"
homepage = "https://github.com/brevis-network/pico-subblock"
exclude = ["**/target"]
version = "0.1.0"

[workspace.dependencies]
# pico
pico-sdk = { git = "https://github.com/brevis-network/pico.git", branch = "pico-subblock" }
pico-patch-libs = { git = "https://github.com/brevis-network/pico.git", branch = "pico-subblock" }
# pico-sdk = { path = "../brevis-vm/sdk/sdk" }
# pico-patch-libs = { path = "../brevis-vm/sdk/patch-libs" }

# misc
async-trait = "0.1.80"
base64 = "0.22.1"
bincode = "=1.3.3"
cfg-if = "1.0.0"
chrono = "0.4.39"
clap = { version = "4.5.7", features = ["derive", "env"] }
csv = "1.1"
derive_more = "2.0"
dotenv = "0.15.0"
eyre = "0.6.12"
futures = "0.3"
hex = "0.4.3"
hex-literal = "0.4.1"
itertools = "0.13.0"
kzg-rs = { git = "https://github.com/brevis-network/kzg-rs", branch = "pico-v0.2.7-fusaka" }
lazy_static = "1.5.0"
rayon = "1.10.0"
reqwest = "0.12.9"
rkyv = "0.8.12"
rlp = "0.5.2"
ruint = { git = "https://github.com/yuwen01/uint", branch = "yuwen/rkyv" }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = "1.0.94"
serde_with = "3.12.0"
sha2 = "0.10.9"
spin = { version = "0.9.8", features = ["mutex"] }
thiserror = "1.0.61"
tokio = { version = "1.21", default-features = false, features = ["rt", "rt-multi-thread"] }
tracing = { version = "0.1.40", default-features = false }
tracing-subscriber = "0.3.18"
url = "2.3"

# workspace
rsp-rpc-db = { path = "./crates/storage/rpc-db" }
rsp-client-executor = { path = "./crates/executor/client" }
rsp-host-executor = { path = "./crates/executor/host" }
rsp-mpt = { path = "./crates/mpt" }
rsp-primitives = { path = "./crates/primitives" }

# reth - pico-subblock-v1-9-1 branch
reth-chainspec = { git = "https://github.com/brevis-network/reth.git", rev = "4382b1a", default-features = false }
reth-codecs = { git = "https://github.com/brevis-network/reth.git", rev = "4382b1a", default-features = false }
reth-consensus = { git = "https://github.com/brevis-network/reth.git", rev = "4382b1a", default-features = false }
reth-db = { git = "https://github.com/brevis-network/reth.git", rev = "4382b1a", default-features = false }
reth-errors = { git = "https://github.com/brevis-network/reth.git", rev = "4382b1a", default-features = false }
reth-ethereum-consensus = { git = "https://github.com/brevis-network/reth.git", rev = "4382b1a", default-features = false }
reth-ethereum-primitives = { git = "https://github.com/brevis-network/reth.git", rev = "4382b1a", default-features = false, features = ["serde"] }
reth-evm = { git = "https://github.com/brevis-network/reth.git", rev = "4382b1a", default-features = false }
reth-evm-ethereum = { git = "https://github.com/brevis-network/reth.git", rev = "4382b1a", default-features = false, features = ["std"] }
reth-evm-optimism = { git = "https://github.com/brevis-network/reth.git", rev = "4382b1a", default-features = false, features = ["optimism"] }
reth-execution-errors = { git = "https://github.com/brevis-network/reth.git", rev = "4382b1a", default-features = false }
reth-execution-types = { git = "https://github.com/brevis-network/reth.git", rev = "4382b1a", default-features = false }
reth-node-ethereum = { git = "https://github.com/brevis-network/reth.git", rev = "4382b1a", default-features = false }
reth-optimism-chainspec = { git = "https://github.com/brevis-network/reth.git", rev = "4382b1a", default-features = false }
reth-optimism-forks = { git = "https://github.com/brevis-network/reth.git", rev = "4382b1a", default-features = false }
reth-primitives = { git = "https://github.com/brevis-network/reth.git", rev = "4382b1a", default-features = false, features = ["serde-bincode-compat", "std"] }
reth-primitives-traits = { git = "https://github.com/brevis-network/reth.git", rev = "4382b1a", default-features = false }
reth-revm = { git = "https://github.com/brevis-network/reth.git", rev = "4382b1a", default-features = false, features = ["std"] }
reth-storage-errors = { git = "https://github.com/brevis-network/reth.git", rev = "4382b1a", default-features = false, features = ["std"] }
reth-trie = { git = "https://github.com/brevis-network/reth.git", rev = "4382b1a", default-features = false, features = ["serde"] }
reth-trie-common = { git = "https://github.com/brevis-network/reth.git", rev = "4382b1a", default-features = false }

# debug on local
# reth-chainspec = { path = "../reth-subblock/crates/chainspec", default-features = false }
# reth-codecs = { path = "../reth-subblock/crates/storage/codecs", default-features = false }
# reth-consensus = { path = "../reth-subblock/crates/consensus/consensus", default-features = false }
