# reth-ethereum-primitives = { path = "../reth-subblock/crates/ethereum/primitives", default-features = false, features = [
#   "serde"
# ] }

# revm
revm = { version = "28.0.1", features = [
    "serde",
    "kzg-rs",
    "bn",
    "optional_balance_check"
], default-features = false }
revm-state = { version = "7.0.1", default-features = false }
revm-primitives = { version = "20.0.0", features = [
    "serde",
    "std",
], default-features = false }
revm-interpreter = { version = "23.0.1", default-features = false }
revm-database = { version = "7.0.1", default-features = false }
revm-database-interface = { version = "7.0.1", default-features = false }

# alloy
alloy-primitives = { version = "1.3.0", default-features = false, features = ["sha3-keccak", "map-foldhash"] }
alloy-provider = { version = "1.0.23", default-features = false, features = [
    "debug-api",
    "reqwest",
    "reqwest-rustls-tls",
] }
alloy-rpc-types = { version = "1.0.23", default-features = false, features = [
    "eth",
] }
alloy-rpc-types-debug = { version = "1.0.23", default-features = false }
alloy-rlp = "0.3.10"
alloy-consensus = { version = "1.0.23", default-features = false, features = ["serde", "serde-bincode-compat"] }
alloy-transport = { version = "1.0.23", default-features = false }
alloy-transport-http = { version = "1.0.23", features = [
    "reqwest-rustls-tls",
], default-features = false }
alloy-eips = { version = "1.0.23", default-features = false }
alloy-trie = "0.9.0"
alloy-network-primitives = { version = "1.0.23", default-features = false }
alloy-network = { version = "1.0.13", default-features = false }

# update for sub-block
alloy-evm = { git = "https://github.com/brevis-network/alloy-evm.git", branch = "pico", default-features = false }
# debug on local
# alloy-evm = { path = "../alloy-evm/crates/evm", default-features = false }

[workspace.lints]
rust.missing_debug_implementations = "warn"
rust.unreachable_pub = "warn"
rust.unused_must_use = "deny"
rust.rust_2018_idioms = { level = "deny", priority = -1 }
rustdoc.all = "warn"

[patch.crates-io]
foldhash = { git = "https://github.com/brevis-network/foldhash.git", branch = "pico" }
revm = { git = "https://github.com/brevis-network/revm.git", branch = "pico" }
revm-bytecode = { git = "https://github.com/brevis-network/revm.git", branch = "pico" }
revm-context = { git = "https://github.com/brevis-network/revm.git", branch = "pico" }
revm-database = { git = "https://github.com/brevis-network/revm.git", branch = "pico" }
revm-database-interface = { git = "https://github.com/brevis-network/revm.git", branch = "pico" }
revm-handler = { git = "https://github.com/brevis-network/revm.git", branch = "pico" }
revm-inspector = { git = "https://github.com/brevis-network/revm.git", branch = "pico" }
revm-interpreter = { git = "https://github.com/brevis-network/revm.git", branch = "pico" }
revm-precompile = { git = "https://github.com/brevis-network/revm.git", branch = "pico" }
revm-primitives = { git = "https://github.com/brevis-network/revm.git", branch = "pico" }
revm-state = { git = "https://github.com/brevis-network/revm.git", branch = "pico" }
sha2 = { git = "https://github.com/brevis-network/hashes.git", package = "sha2", branch = "sha2-0.10.9"}
