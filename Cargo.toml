# reth-errors = { path = "../reth-subblock/crates/errors", default-features = false }
# reth-ethereum-consensus = { path = "../reth-subblock/crates/ethereum/consensus", default-features = false }
# reth-ethereum-primitives = { path = "../reth-subblock/crates/ethereum/primitives", default-features = false, features = ["serde"] }
# reth-evm = { path = "../reth-subblock/crates/evm/evm", default-features = false }
# reth-evm-ethereum = { path = "../reth-subblock/crates/ethereum/evm", default-features = false, features = ["std"] }
# reth-evm-optimism = { path = "../reth-subblock/crates/evm-optimism", default-features = false, features = ["optimism"] }
# reth-execution-errors = { path = "../reth-subblock/crates/evm/execution-errors", default-features = false }
# reth-execution-types = { path = "../reth-subblock/crates/evm/execution-types", default-features = false }
# reth-node-ethereum = { path = "../reth-subblock/crates/node-ethereum", default-features = false }
# reth-optimism-chainspec = { path = "../reth-subblock/crates/optimism-chainspec", default-features = false }
# reth-optimism-forks = { path = "../reth-subblock/crates/optimism-forks", default-features = false }
# reth-primitives = { path = "../reth-subblock/crates/primitives", default-features = false, features = ["serde-bincode-compat", "std"] }
# reth-primitives-traits = { path = "../reth-subblock/crates/primitives-traits", default-features = false }
# reth-revm = { path = "../reth-subblock/crates/revm", default-features = false, features = ["std"] }
# reth-storage-errors = { path = "../reth-subblock/crates/storage/errors", default-features = false, features = ["std"] }
# reth-trie = { path = "../reth-subblock/crates/trie/trie", default-features = false, features = ["serde"] }
# reth-trie-common = { path = "../reth-subblock/crates/trie-common", default-features = false }

# revm
revm = { git = "https://github.com/brevis-network/revm.git", branch = "pico-v97-31-0-1", features = ["bn", "optional_balance_check", "serde"], default-features = false }
revm-database = { git = "https://github.com/brevis-network/revm.git", branch = "pico-v97-31-0-1", default-features = false }
revm-database-interface = { git = "https://github.com/brevis-network/revm.git", branch = "pico-v97-31-0-1", default-features = false }
revm-interpreter = { git = "https://github.com/brevis-network/revm.git", branch = "pico-v97-31-0-1", default-features = false }
revm-primitives = { git = "https://github.com/brevis-network/revm.git", branch = "pico-v97-31-0-1", features = ["serde", "std"], default-features = false }
revm-state = { git = "https://github.com/brevis-network/revm.git", branch = "pico-v97-31-0-1", default-features = false }

# alloy
alloy-consensus = { version = "1.1.0", default-features = false, features = ["serde", "serde-bincode-compat"] }
alloy-eips = { version = "1.1.0", default-features = false }
alloy-network = { version = "1.1.0", default-features = false }
alloy-network-primitives = { version = "1.1.0", default-features = false }
alloy-primitives = { git = "https://github.com/brevis-network/alloy-core.git", branch = "pico-v1-4-1", default-features = false, features = ["map-foldhash", "sha3-keccak"] }
alloy-provider = { version = "1.1.0", default-features = false, features = ["debug-api", "reqwest", "reqwest-rustls-tls"] }
alloy-rlp = "0.3.10"
alloy-rpc-types = { version = "1.1.0", default-features = false, features = ["eth"] }
alloy-rpc-types-debug = { version = "1.1.0", default-features = false }
alloy-transport = { version = "1.1.0", default-features = false }
alloy-transport-http = { version = "1.1.0", features = ["reqwest-rustls-tls"], default-features = false }
alloy-trie = "0.9.1"

# update for sub-block
alloy-evm = { git = "https://github.com/brevis-network/alloy-evm.git", branch = "pico-v0-23-0", default-features = false }
# debug on local
# alloy-evm = { path = "../alloy-evm/crates/evm", default-features = false }

[workspace.lints]
rust.missing_debug_implementations = "warn"
rust.unreachable_pub = "warn"
rust.unused_must_use = "deny"
rust.rust_2018_idioms = { level = "deny", priority = -1 }
rustdoc.all = "warn"

[patch.crates-io]
# alloy
alloy-evm = { git = "https://github.com/brevis-network/alloy-evm.git", branch = "pico-v0-23-0" }
alloy-primitives = { git = "https://github.com/brevis-network/alloy-core.git", branch = "pico-v1-4-1" }
# misc
foldhash = { git = "https://github.com/brevis-network/foldhash.git", branch = "pico-v0-2-0" }
sha2 = { git = "https://github.com/brevis-network/hashes.git", package = "sha2", branch = "sha2-0.10.9"}
# revm
revm = { git = "https://github.com/brevis-network/revm.git", branch = "pico-v97-31-0-1" }
revm-bytecode = { git = "https://github.com/brevis-network/revm.git", branch = "pico-v97-31-0-1" }
revm-context = { git = "https://github.com/brevis-network/revm.git", branch = "pico-v97-31-0-1" }
revm-context-interface = { git = "https://github.com/brevis-network/revm.git", branch = "pico-v97-31-0-1" }
revm-database = { git = "https://github.com/brevis-network/revm.git", branch = "pico-v97-31-0-1" }
revm-database-interface = { git = "https://github.com/brevis-network/revm.git", branch = "pico-v97-31-0-1" }
revm-handler = { git = "https://github.com/brevis-network/revm.git", branch = "pico-v97-31-0-1" }
revm-inspector = { git = "https://github.com/brevis-network/revm.git", branch = "pico-v97-31-0-1" }
revm-interpreter = { git = "https://github.com/brevis-network/revm.git", branch = "pico-v97-31-0-1" }
revm-precompile = { git = "https://github.com/brevis-network/revm.git", branch = "pico-v97-31-0-1" }
revm-primitives = { git = "https://github.com/brevis-network/revm.git", branch = "pico-v97-31-0-1" }
revm-state = { git = "https://github.com/brevis-network/revm.git", branch = "pico-v97-31-0-1" }

